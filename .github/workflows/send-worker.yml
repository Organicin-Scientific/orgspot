name: Send worker

# Runs the campaign send worker every 10 minutes so that retries (rate limits, provider
# 5xx) are picked up promptly. The Vercel cron only runs once a day, and the worker moves
# any interrupted send older than 23 hours to manual review, so a daily-only schedule
# turns ordinary transient failures into "needs review".
#
# Setup (repository Settings > Secrets and variables > Actions):
#   variable ORGSPOT_URL   e.g. https://orgspot.vercel.app (no trailing slash)
#   secret   CRON_SECRET   the same value as CRON_SECRET in Vercel production
# The job is skipped until ORGSPOT_URL is set.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: send-worker
  cancel-in-progress: false

jobs:
  tick:
    if: ${{ vars.ORGSPOT_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run send worker
        env:
          ORGSPOT_URL: ${{ vars.ORGSPOT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${ORGSPOT_URL}/api/internal/worker"
