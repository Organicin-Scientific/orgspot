name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: demo-organicin
      ALLOWED_FIREBASE_PROJECT_ID: demo-organicin
      FIREBASE_STORAGE_BUCKET: demo-organicin.appspot.com
      EMAIL_SENDING_ENABLED: "false"
      CRON_SECRET: ci-fake-cron-secret-00000000000000000001
      TOKEN_SIGNING_SECRET: ci-fake-token-signing-secret-00000000000000001
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key-ci-only-replace
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-organicin.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-organicin
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: ""
      NEXT_PUBLIC_AUTH_EMULATOR_LOGIN: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  emulator:
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: demo-organicin
      ALLOWED_FIREBASE_PROJECT_ID: demo-organicin
      FIREBASE_STORAGE_BUCKET: demo-organicin.appspot.com
      EMAIL_SENDING_ENABLED: "false"
      CRON_SECRET: ci-fake-cron-secret-00000000000000000001
      TOKEN_SIGNING_SECRET: ci-fake-token-signing-secret-00000000000000001
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key-ci-only-replace
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-organicin.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-organicin
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: ""
      NEXT_PUBLIC_AUTH_EMULATOR_LOGIN: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Firebase tools version (emulator cache key)
        id: firebase_tools_version
        run: |
          VER=$(node -p "require('./package.json').devDependencies['firebase-tools']")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firebase-tools-${{ steps.firebase_tools_version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools globally
        run: npm i -g "firebase-tools@${{ steps.firebase_tools_version.outputs.version }}"

      - name: Emulator tests
        run: npm run test:emulator

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
      APP_ENV: local
      APP_URL: http://localhost:3000
      FIREBASE_PROJECT_ID: demo-organicin
      ALLOWED_FIREBASE_PROJECT_ID: demo-organicin
      FIREBASE_STORAGE_BUCKET: demo-organicin.appspot.com
      EMAIL_SENDING_ENABLED: "false"
      CRON_SECRET: ci-fake-cron-secret-00000000000000000001
      TOKEN_SIGNING_SECRET: ci-fake-token-signing-secret-00000000000000001
      NEXT_PUBLIC_FIREBASE_API_KEY: fake-api-key-ci-only-replace
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-organicin.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-organicin
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_AUTH_EMULATOR_LOGIN: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Firebase tools version (emulator cache key)
        id: firebase_tools_version
        run: |
          VER=$(node -p "require('./package.json').devDependencies['firebase-tools']")
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-firebase-tools-${{ steps.firebase_tools_version.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Install firebase-tools globally
        run: npm i -g "firebase-tools@${{ steps.firebase_tools_version.outputs.version }}"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
